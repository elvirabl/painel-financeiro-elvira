<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Testes XML — Elvira</title><h1>Testes XML no navegador</h1><pre id="out"></pre><script type="module">import {parseNfe,registerPurchase} from './domain.mjs';import {empty} from './store.mjs';let key='1'.repeat(44);let xml='<nfeProc xmlns="http://www.portalfiscal.inf.br/nfe"><NFe><infNFe Id="NFe'+key+'"><ide><nNF>123</nNF><dhEmi>2026-10-10T10:00:00-03:00</dhEmi></ide><emit><xNome>DEMONSTRAÇÃO</xNome></emit><det nItem="1"><prod><cProd>A</cProd><xProd>Tubo</xProd><uCom>BR</uCom><qCom>2</qCom><vProd>120</vProd><vFrete>6</vFrete><vDesc>2</vDesc><vOutro>4</vOutro></prod></det></infNFe></NFe></nfeProc>';let tests=[['Extrai fornecedor, chave, datas e itens',()=>{let p=parseNfe(xml);if(p.key!==key||p.supplier!=='DEMONSTRAÇÃO'||p.issued!=='2026-10-10'||p.items[0].quantity!==2||p.items[0].freight!==6)throw Error('Extração divergente')}],['Rejeita XML inválido',()=>{let ok=false;try{parseNfe('<x>')}catch{ok=true}if(!ok)throw Error('XML aceito')}],['Rejeita arquivo sem NF-e',()=>{let ok=false;try{parseNfe('<x/>')}catch{ok=true}if(!ok)throw Error('Arquivo aceito')}],['Impede nota duplicada',()=>{let s=empty();s.materials=[{id:'m',cost:10}];let p={...parseNfe(xml),id:'p',received:'2026-10-10'};p.items=p.items.map(x=>({...x,materialId:'m',factor:6}));registerPurchase(s,p);let ok=false;try{registerPurchase(s,p)}catch{ok=true}if(!ok||s.purchases.length!==1||s.materials[0].cost!==10)throw Error('Duplicidade / aprovação incorreta')}]];for(let [name,fn] of tests){try{fn();document.querySelector('#out').textContent+='PASSOU — '+name+'\n'}catch(e){document.querySelector('#out').textContent+='FALHOU — '+name+': '+e.message+'\n'}}</script></html>
