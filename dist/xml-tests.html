<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Testes XML — Elvira</title><h1>Testes XML no navegador</h1><p>Fixture fictícia: NF-e DEMONSTRAÇÃO. Nenhum dado real é cadastrado.</p><pre id="out"></pre><script type="module">import * as D from './domain.mjs';import {empty} from './store.mjs';const xml=await (await fetch('./nfe-demonstracao.xml')).text();let tests=[['Fornecedor e código originais',()=>{let n=D.parseNfe(xml);if(n.supplierDocument!=='12345678000190'||n.items[0].code!=='00001-A')throw Error('Dados divergentes')}],['Rateio e total da nota',()=>{let n=D.parseNfe(xml);if(n.total!==358||n.calculatedTotal!==358||n.items[0].allocatedFreight!==10)throw Error('Totais divergentes')}],['Vencimentos exatos',()=>{let n=D.parseNfe(xml);if(n.installments[1].due!=='2026-12-20'||n.installments[1].amount!==179)throw Error('Duplicata divergente')}],['Cadastro e aprovação integral',()=>{let n=D.parseNfe(xml),s=empty(),p=D.importInvoice(s,n,{received:'2026-10-12',items:n.items.map(x=>({category:'Matéria-prima',factor:1,unit:x.unit}))});if(s.materials[0].cost!==null)throw Error('Custo aprovado automaticamente');D.decideInvoice(s,p.id,true,'Teste');if(p.approvedTotal!==358)throw Error('Total aprovado divergente')}],['XML inválido',()=>{let caught=false;try{D.parseNfe('<x>')}catch{caught=true}if(!caught)throw Error('XML inválido aceito')}]];for(let [name,fn] of tests){try{fn();document.querySelector('#out').textContent+='PASSOU — '+name+'\n'}catch(e){document.querySelector('#out').textContent+='FALHOU — '+name+': '+e.message+'\n'}}</script></html>
